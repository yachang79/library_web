{% extends 'base.html' %}
{% block title %}新增借閱 - 圖書館借閱系統{% endblock %}

{% block content %}
<div class="page-header">
  <h2><i class="bi bi-plus-circle me-2"></i>新增借閱登記</h2>
  <a href="{{ url_for('borrowings') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i> 返回列表
  </a>
</div>

<div class="card" style="max-width: 560px;">
  <div class="card-body p-4">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">借閱會員 <span class="text-danger">*</span></label>
        <select name="member_id" class="form-select" required>
          <option value="">-- 請選擇會員 --</option>
          {% for m in members %}
          <option value="{{ m.id }}">{{ m.name }} ({{ m.member_id }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">借閱書籍 <span class="text-danger">*</span></label>
        {% if available_books %}
        <select name="book_id" class="form-select" required>
          <option value="">-- 請選擇可借閱書籍 --</option>
          {% for b in available_books %}
          <option value="{{ b.id }}">{{ b.title }} [{{ b.serial_no }}]</option>
          {% endfor %}
        </select>
        {% else %}
        <div class="alert alert-warning mb-0">目前沒有可借閱的書籍（全數借出中）</div>
        {% endif %}
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">借閱日期 <span class="text-danger">*</span></label>
        <input type="date" name="borrow_date" class="form-control" value="{{ today }}" required>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4" {% if not available_books %}disabled{% endif %}>
          <i class="bi bi-check-lg me-1"></i> 確認借閱
        </button>
        <a href="{{ url_for('borrowings') }}" class="btn btn-outline-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
