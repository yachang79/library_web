{% extends 'base.html' %}
{% block title %}{% if action == 'new' %}新增會員{% else %}編輯會員{% endif %} - 圖書館借閱系統{% endblock %}

{% block content %}
<div class="page-header">
  <h2>
    <i class="bi bi-person-{% if action == 'new' %}plus{% else %}gear{% endif %} me-2"></i>
    {% if action == 'new' %}新增會員{% else %}編輯會員{% endif %}
  </h2>
  <a href="{{ url_for('members') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i> 返回列表
  </a>
</div>

<div class="card" style="max-width: 560px;">
  <div class="card-body p-4">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">姓名 <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" value="{{ form.name or '' }}" required placeholder="請輸入姓名">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">會員編號 <span class="text-danger">*</span></label>
        <input type="text" name="member_id" class="form-control" value="{{ form.member_id or '' }}" required placeholder="例：M001">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">電話</label>
        <input type="text" name="phone" class="form-control" value="{{ form.phone or '' }}" placeholder="例：0912-345-678">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">地址</label>
        <input type="text" name="address" class="form-control" value="{{ form.address or '' }}" placeholder="請輸入地址">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check-lg me-1"></i> {% if action == 'new' %}新增{% else %}儲存{% endif %}
        </button>
        <a href="{{ url_for('members') }}" class="btn btn-outline-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
